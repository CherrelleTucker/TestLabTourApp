<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Time Calculator - Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #f5f5f5;
    }
    h1 { color: #0b3d91; }
    .calculator {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    select, button {
      padding: 0.5rem;
      font-size: 1rem;
      margin: 0.5rem;
    }
    button {
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 0.75rem 1.5rem;
    }
    button:hover { background: #0a2f6e; }
    .result {
      margin-top: 1rem;
      padding: 1rem;
      background: #e8f4f8;
      border-left: 4px solid #0b3d91;
      border-radius: 4px;
      font-size: 1.1rem;
    }
    .matrix {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.5rem;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #0b3d91;
      color: white;
      position: sticky;
      top: 0;
    }
    td.walk { background: #d4edda; }
    td.drive { background: #fff3cd; }
    .legend {
      margin: 1rem 0;
      display: flex;
      gap: 2rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .legend-color {
      width: 20px;
      height: 20px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>🚗 Tour App Travel Time Calculator</h1>

  <div class="calculator">
    <h2>Calculate Travel Time Between Stops</h2>
    <div>
      <label>From:
        <select id="fromStop"></select>
      </label>
      <label>To:
        <select id="toStop"></select>
      </label>
      <button onclick="calculateSingle()">Calculate</button>
    </div>
    <div id="result" class="result" style="display: none;"></div>
  </div>

  <div class="matrix">
    <h2>Full Travel Time Matrix</h2>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: #d4edda;"></div>
        <span>Walk (< 300m)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #fff3cd;"></div>
        <span>Drive (≥ 300m)</span>
      </div>
    </div>
    <div id="matrix"></div>
  </div>

  <script src="data/gpsCoordinates.js"></script>
  <script>
    // Populate dropdowns
    const stopIds = Object.keys(window.GPS_COORDS).filter(id => !id.startsWith('_'));
    const fromSelect = document.getElementById('fromStop');
    const toSelect = document.getElementById('toStop');

    stopIds.forEach(id => {
      const stop = window.GPS_COORDS[id];
      const option1 = document.createElement('option');
      option1.value = id;
      option1.textContent = `${id} - ${stop.label}`;
      fromSelect.appendChild(option1);

      const option2 = document.createElement('option');
      option2.value = id;
      option2.textContent = `${id} - ${stop.label}`;
      toSelect.appendChild(option2);
    });

    // Calculate single route
    function calculateSingle() {
      const from = fromSelect.value;
      const to = toSelect.value;

      if (from === to) {
        document.getElementById('result').innerHTML = '⚠️ Same stop selected';
        document.getElementById('result').style.display = 'block';
        return;
      }

      const result = calculateTravelTime(from, to);
      const distanceKm = (result.distance / 1000).toFixed(2);
      const distanceFt = (result.distance * 3.28084).toFixed(0);

      document.getElementById('result').innerHTML = `
        <strong>${window.GPS_COORDS[from].label} → ${window.GPS_COORDS[to].label}</strong><br>
        Distance: ${distanceKm} km (${distanceFt} ft)<br>
        Travel Time: <strong>${result.minutes} minutes</strong> (${result.mode})<br>
        <small>GPS: ${window.GPS_COORDS[from].lat.toFixed(6)}, ${window.GPS_COORDS[from].lng.toFixed(6)} →
        ${window.GPS_COORDS[to].lat.toFixed(6)}, ${window.GPS_COORDS[to].lng.toFixed(6)}</small>
      `;
      document.getElementById('result').style.display = 'block';
    }

    // Build full matrix
    function buildMatrix() {
      const matrix = buildTravelTimeMatrix();

      let html = '<table><thead><tr><th>From \\ To</th>';
      stopIds.forEach(id => {
        html += `<th title="${window.GPS_COORDS[id].label}">${id}</th>`;
      });
      html += '</tr></thead><tbody>';

      stopIds.forEach(fromId => {
        html += `<tr><th title="${window.GPS_COORDS[fromId].label}">${fromId}</th>`;
        stopIds.forEach(toId => {
          const time = matrix[fromId][toId];
          if (time.minutes === 0) {
            html += '<td style="background: #eee;">—</td>';
          } else {
            const className = time.mode === 'walk' ? 'walk' : 'drive';
            const distKm = (time.distance / 1000).toFixed(1);
            html += `<td class="${className}" title="${distKm}km ${time.mode}">${time.minutes}m</td>`;
          }
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('matrix').innerHTML = html;
    }

    // Initialize
    buildMatrix();
  </script>
</body>
</html>
